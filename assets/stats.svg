<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 190" width="960" height="190" role="img" aria-labelledby="t d"><title id="t">Escala dos sistemas de notificação</title><desc id="d">300 mil e-mails e 200 mil mensagens de WhatsApp a cada 7 dias, cerca de 10 milhões de push em 6 meses, 4 anos de experiência.</desc><style>@font-face{font-family:'AF Black';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'AF Body';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}.fb{font-family:'AF Black','Archivo Black','Arial Black',Impact,sans-serif}.fo{font-family:'AF Body',Archivo,'Segoe UI',Helvetica,Arial,sans-serif}.fw{font-weight:700}.fm{font-family:'AF Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){.mv{display:none}}</style><defs><clipPath id="c"><rect width="960" height="190" rx="20"/></clipPath><linearGradient id="sw"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="959" height="189" rx="20" fill="#070B14" stroke="#1B2A45"/><text class="fb" x="36.0" y="88.0" font-size="46" fill="#4DA3FF" text-anchor="start" >300 mil</text><text class="fo" x="36.0" y="120.0" font-size="15" fill="#EAF2FF" text-anchor="start" >e-mails transacionais</text><text class="fo" x="36.0" y="141.0" font-size="15" fill="#8FA3C4" text-anchor="start" >a cada 7 dias</text><text class="fb" x="276.0" y="88.0" font-size="46" fill="#3DDC97" text-anchor="start" >200 mil</text><text class="fo" x="276.0" y="120.0" font-size="15" fill="#EAF2FF" text-anchor="start" >mensagens de WhatsApp</text><text class="fo" x="276.0" y="141.0" font-size="15" fill="#8FA3C4" text-anchor="start" >a cada 7 dias</text><line x1="240.0" y1="40" x2="240.0" y2="150" stroke="#1B2A45"/><text class="fb" x="516.0" y="88.0" font-size="46" fill="#FF7A70" text-anchor="start" >~10 mi</text><text class="fo" x="516.0" y="120.0" font-size="15" fill="#EAF2FF" text-anchor="start" >push notifications</text><text class="fo" x="516.0" y="141.0" font-size="15" fill="#8FA3C4" text-anchor="start" >nos últimos 6 meses</text><line x1="480.0" y1="40" x2="480.0" y2="150" stroke="#1B2A45"/><text class="fb" x="756.0" y="88.0" font-size="46" fill="#A78BFA" text-anchor="start" >4 anos</text><text class="fo" x="756.0" y="120.0" font-size="15" fill="#EAF2FF" text-anchor="start" >de experiência</text><text class="fo" x="756.0" y="141.0" font-size="15" fill="#8FA3C4" text-anchor="start" >de estagiário a Full Stack</text><line x1="720.0" y1="40" x2="720.0" y2="150" stroke="#1B2A45"/><g class="mv" clip-path="url(#c)"><rect y="0" width="200" height="2" fill="url(#sw)"><animate attributeName="x" from="-200" to="960" dur="7s" repeatCount="indefinite"/></rect></g></svg>